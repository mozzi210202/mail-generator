<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>작가 대응 메일 자동 생성기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #16a34a;
  --primary-hover: #15803d;
  --primary-light: #f0fdf4;
  --primary-border: #bbf7d0;
  --bg: #f0fdf4;
  --white: #fff;
  --text-main: #111;
  --text-sub: #666;
  --border: #e1e4e8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); min-height: 100vh; color: var(--text-main); line-height: 1.6; }

.page-wrap { max-width: 860px; margin: 0 auto; padding: 32px 16px 80px; }

.page-title { font-size: 1.5rem; font-weight: 700; color: var(--primary); border-left: 4px solid var(--primary); padding-left: 14px; margin-bottom: 16px; }

.notice-box { background: #fffbe6; border: 1px solid #ffe58f; border-radius: 10px; padding: 12px 16px; font-size: 0.85rem; color: #7a6000; margin-bottom: 24px; line-height: 1.7; }
.notice-box b { color: #d46b08; }

/* 레이아웃 */
.layout { display: grid; grid-template-columns: 190px 1fr; background: var(--white); border-radius: 14px; border: 1px solid var(--border); overflow: hidden; box-shadow: 0 4px 20px rgba(123,95,245,0.07); }

/* 사이드바 */
.sidebar { background: #faf9ff; border-right: 1px solid var(--border); padding: 20px 0; }
.sidebar-label { font-size: 11px; color: var(--text-sub); padding: 0 16px 10px; letter-spacing: 0.05em; font-weight: 500; }
.tab-item { display: flex; align-items: center; gap: 10px; padding: 11px 16px; font-size: 13px; color: var(--text-sub); cursor: pointer; border-left: 3px solid transparent; transition: all 0.15s; user-select: none; }
.tab-item:hover { background: #f0ecff; color: var(--primary); }
.tab-item.active { background: var(--primary-light); color: var(--primary); border-left-color: var(--primary); font-weight: 700; }
.tab-item.disabled { opacity: 0.35; cursor: default; pointer-events: none; }
.tab-num { width: 22px; height: 22px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text-sub); flex-shrink: 0; font-weight: 700; transition: all 0.15s; }
.tab-item.active .tab-num { background: var(--primary); color: #fff; }
.tab-divider { border: none; border-top: 1px solid var(--border); margin: 8px 0; }

/* 메인 */
.main-content { padding: 28px; overflow: hidden; }
.loading-msg { text-align: center; padding: 40px; color: var(--text-sub); font-size: 13px; }

/* 섹션 */
.section { margin-bottom: 24px; }
.section-title { font-size: 14px; font-weight: 700; color: var(--primary); border-left: 3px solid var(--primary); padding-left: 10px; margin-bottom: 14px; }

/* 폼 요소 */
.radio-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.radio-label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
.radio-label input[type="radio"] { accent-color: var(--primary); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; color: var(--text-sub); font-weight: 500; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
input[type="text"], input[type="date"], input[type="password"], select, textarea {
  padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 13px; font-family: inherit; outline: none; transition: border 0.15s;
  background: var(--white); color: var(--text-main);
}
input:focus, select:focus, textarea:focus { border-color: var(--primary); }
input[readonly] { background: #faf9ff; color: var(--text-sub); }

/* 태그 */
.tag-group { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); font-size: 12px; font-family: inherit; cursor: pointer; color: var(--text-sub); background: var(--white); transition: all 0.15s; user-select: none; }
.tag:hover { border-color: var(--primary); color: var(--primary); }
.tag.selected { background: var(--primary); color: #fff; border-color: var(--primary); }

/* 관리자 입력 */
.manager-input { width: 160px; }

/* 미리보기 */
.preview-area { background: #faf9ff; border: 1px solid var(--primary-border); border-radius: 12px; padding: 16px 20px; min-height: 180px; }
.preview-subject-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.preview-badge { font-size: 11px; background: var(--primary-light); color: var(--primary); padding: 3px 8px; border-radius: 6px; font-weight: 700; flex-shrink: 0; margin-top: 1px; }
.preview-subject-text { font-size: 13px; color: var(--text-sub); font-style: italic; }
.preview-subject-text.filled { color: var(--text-main); font-style: normal; font-weight: 500; }
.preview-body { font-size: 13px; color: var(--text-sub); white-space: pre-wrap; line-height: 1.9; font-style: italic; }
.preview-body.filled { color: var(--text-main); font-style: normal; }

/* 버튼 */
.btn-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 22px; border-radius: 50px; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; transition: all 0.15s; border: 1px solid var(--border); background: var(--white); color: var(--text-main); }
.btn:hover { background: #f5f5f5; }
.btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn.primary:hover { background: var(--primary-hover); }
.btn.full { width: 100%; justify-content: center; border-radius: 10px; padding: 13px; }
.copied-msg { font-size: 12px; color: #52c41a; display: none; }

/* 메모장 */
.memo-area { width: 100%; min-height: 280px; padding: 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; font-family: inherit; line-height: 1.9; resize: vertical; outline: none; }
.memo-area:focus { border-color: var(--primary); }

/* Asana 섹션 */
.asana-section { margin-top: 32px; padding-top: 28px; border-top: 2px dashed var(--primary-border); }
.asana-header { font-size: 1rem; font-weight: 700; color: #b91c1c; margin-bottom: 20px; }
.asana-token-box { background: #faf9ff; border: 1px solid var(--primary-border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.token-row { display: flex; gap: 8px; }
.token-row input { flex: 1; }
.token-btn { white-space: nowrap; border-radius: 8px !important; padding: 9px 16px !important; }
.token-status { font-size: 12px; margin-top: 6px; }

/* 스텝 */
.asana-step { border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 14px; background: var(--white); }
.asana-step.locked { opacity: 0.4; pointer-events: none; }
.step-label { font-size: 11px; font-weight: 700; color: var(--primary); letter-spacing: 0.05em; margin-bottom: 12px; }

/* 분류 버튼 */


/* 하위작업 */
.subtask-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
.subtask-row:last-child { border-bottom: none; }
.subtask-row input[type="checkbox"] { accent-color: var(--primary); width: 16px; height: 16px; margin-top: 2px; flex-shrink: 0; }
.subtask-info { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.subtask-label { font-size: 13px; font-weight: 500; }
.subtask-meta { font-size: 11px; color: var(--text-sub); }

/* 위치 선택 탭 */
.location-tabs { display: flex; gap: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
.loc-tab { flex: 1; padding: 9px; font-size: 13px; font-family: inherit; cursor: pointer; border: none; background: var(--white); color: var(--text-sub); font-weight: 500; transition: all 0.15s; }
.loc-tab.active { background: var(--primary); color: #fff; }

.asana-result { margin-top: 12px; font-size: 13px; text-align: center; min-height: 20px; font-weight: 500; }

footer { text-align: center; margin-top: 32px; font-size: 12px; color: #bbb; }

@media (max-width: 600px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
  .field-row { grid-template-columns: 1fr; }
}

.token-guide {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--primary-border);
}
.token-guide-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 8px;
}
.token-guide-steps {
  font-size: 12px;
  color: var(--text-sub);
  padding-left: 18px;
  line-height: 2;
}
.token-guide-steps a {
  color: var(--primary);
  text-decoration: none;
}
.token-guide-steps a:hover { text-decoration: underline; }
.token-guide-steps b { color: var(--text-main); }
.token-warning {
  margin-top: 10px;
  background: #fff5f5;
  border: 1px solid #ffd0d0;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 12px;
  color: #7a0000;
  line-height: 1.9;
}
.token-warning b { color: #b91c1c; }

</style>
</head>
<body>

<div class="page-wrap">
  <h1 class="page-title">작가 대응 메일 자동 생성기</h1>

  <div class="notice-box">
    💡 <b>Gmail 붙여넣기 안내</b> — 모든 복사 버튼은 서식이 유지됩니다. Gmail 본문란에 <b>Ctrl+V</b> (Mac: ⌘+V)로 붙여넣으세요.<br>
    본 메일 자동 생성기는 단순 문의에 대한 최신 유형을 하나의 툴로 통합해, 통일된 안내 문구를 기반으로 빠르고 효율적인 응대를 지원합니다.
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-label">메일 유형</div>
      <div class="tab-item active" onclick="switchTab(this,'gyojunggo')">
        <span class="tab-num">1</span> 교정고 발송 일정
      </div>
      <div class="tab-item" onclick="switchTab(this,'pyoji')">
        <span class="tab-num">2</span> 표지제안서
      </div>
      <div class="tab-item disabled">
        <span class="tab-num">3</span> 서지 정보 요청
      </div>
      <div class="tab-item disabled">
        <span class="tab-num">4</span> 계약 조건 안내
      </div>
      <div class="tab-item disabled">
        <span class="tab-num">5</span> 원고 전달 요청
      </div>
      <hr class="tab-divider">
      <div class="tab-item" onclick="switchTab(this,'memo')">
        <span class="tab-num" style="font-size:10px;">✎</span> 메일 수정 (메모장)
      </div>
    </div>

    <div class="main-content" id="mainContent">
      <div class="loading-msg">데이터 불러오는 중...</div>
    </div>
  </div>

  <footer>Made by 디리토 팀 장서하</footer>
</div>

<script>
// ===== 설정 =====
const SHEET_ID = '1fe7efREbPYe2UvoZ1j1wcuIN9JMlxAY50twcOgcA6w4';
const TEMPLATES_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Templates`;
const OPTIONS_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Options`;

// ===== 상태 =====
let templates = {};
let options = { label: [], workType: [] };
let selectedLabels = [];
let selectedWorkTypes = [];
let locMode = 'link'; // 'project' | 'link'
let currentTab = 'gyojunggo';

// ===== 데이터 로드 =====
async function loadData() {
  try {
    const [resTpl, resOpt] = await Promise.all([
      fetch(TEMPLATES_URL + '&t=' + Date.now()),
      fetch(OPTIONS_URL + '&t=' + Date.now())
    ]);
    const tplText = await resTpl.text();
    const optText = await resOpt.text();
    const tplJson = JSON.parse(tplText.substring(tplText.indexOf('(') + 1, tplText.lastIndexOf(')')));
    const optJson = JSON.parse(optText.substring(optText.indexOf('(') + 1, optText.lastIndexOf(')')));

    tplJson.table.rows.slice(1).forEach(row => {
      if (!row.c?.[0]?.v) return;
      const key = row.c[0].v.toString().trim();
      templates[key] = {
        title: row.c[1]?.v || '',
        body: (row.c[2]?.v || '').replace(/\\n/g, '\n')
      };
    });

    optJson.table.rows.slice(1).forEach(row => {
      if (!row.c?.[0]?.v) return;
      const key = row.c[0].v.toString().trim();
      const val = row.c[1]?.v?.toString().trim();
      if (val && options[key] !== undefined) options[key].push(val);
    });

    renderTab(currentTab);
  } catch(e) {
    document.getElementById('mainContent').innerHTML =
      `<div class="loading-msg" style="color:#e53e3e;">데이터 로딩 실패.<br>구글 시트 공유 설정을 확인해 주세요.</div>`;
  }
}

// ===== 탭 전환 =====
function switchTab(el, tabId) {
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  currentTab = tabId;
  selectedLabels = [];
  selectedWorkTypes = [];
  renderTab(tabId);
}

function renderTab(tabId) {
  if (tabId === 'memo') { renderMemo(); return; }
  if (tabId === 'gyojunggo') renderGyojunggo();
  if (tabId === 'pyoji') renderPyoji();
}

// ===== 메모장 =====
function renderMemo() {
  document.getElementById('mainContent').innerHTML = `
    <div class="section">
      <div class="section-title">메모장 (직접 수정)</div>
      <textarea class="memo-area" id="memoArea" placeholder="메일 내용을 직접 입력하거나 붙여넣어 수정하세요."></textarea>
    </div>
    <div class="btn-row">
      <button class="btn primary" onclick="copyMemo()">📋 본문 복사</button>
      <span class="copied-msg" id="copiedMemo"></span>
    </div>`;
}

// ===== 교정고 탭 렌더링 =====
function renderGyojunggo() {
  const labelTags = options.label.map(l =>
    `<span class="tag" onclick="toggleLabel(this,'${l}')">${l}</span>`).join('');
  const workTypeTags = options.workType.map(w =>
    `<span class="tag" onclick="toggleWorkType(this,'${w}')">${w}</span>`).join('');

  document.getElementById('mainContent').innerHTML = `
    <!-- 담당자 -->
    <div class="section">
      <div class="section-title">담당자명 설정</div>
      <div class="radio-row">
        <label class="radio-label"><input type="radio" name="mgr" value="none" checked onchange="updatePreview()"> 없음</label>
        <label class="radio-label"><input type="radio" name="mgr" value="direct" onchange="updatePreview()"> 직접 입력</label>
        <input type="text" class="manager-input" id="mgrName" placeholder="담당자명" oninput="updatePreview()">
      </div>
    </div>

    <!-- 입력 -->
    <div class="section">
      <div class="section-title">입력</div>
      <div class="field" style="margin-bottom:14px;">
        <label>레이블</label>
        <div class="tag-group" id="labelGroup">${labelTags}</div>
      </div>
      <div class="field-row" style="margin-bottom:14px;">
        <div class="field">
          <label>작품명</label>
          <input type="text" id="workTitle" placeholder="작품명 입력" oninput="updatePreview()">
        </div>
        <div class="field">
          <label>원고 분량</label>
          <input type="text" id="workVolume" placeholder="예) 1-50화" oninput="updatePreview()">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>작업 종류 (복수 선택 가능)</label>
          <div class="tag-group" id="workTypeGroup">${workTypeTags}</div>
        </div>
        <div class="field">
          <label>예정 일정</label>
          <input type="date" id="schedDate" onchange="updatePreview()" onclick="try{this.showPicker()}catch(e){}">
        </div>
      </div>
    </div>

    <!-- 메일 미리보기 -->
    <div class="section">
      <div class="section-title">완성된 메일 미리보기</div>
      <div class="preview-area">
        <div class="preview-subject-row">
          <span class="preview-badge">제목</span>
          <span class="preview-subject-text" id="previewSubject">입력값을 채우면 자동 생성됩니다</span>
        </div>
        <div class="preview-body" id="previewBody">위 항목을 입력해 주세요.</div>
      </div>
      <div class="btn-row">
        <button class="btn primary" onclick="copyBody()">📋 본문 복사</button>
        <button class="btn" onclick="copyAll()">📎 제목+본문 복사</button>
        <span class="copied-msg" id="copiedMsg">복사됐어요!</span>
      </div>
      <div style="margin-top:10px;font-size:12px;color:#b45309;background:#fff8e1;border:1px solid #ffe58f;border-radius:8px;padding:8px 14px;">⚠️ 첨부 파일을 잊지 마세요!</div>
    </div>

    <!-- Asana -->
    <div class="asana-section">
      <div class="asana-header">🚨 잠깐! 아사나 태스크 생성했나요?</div>

      <!-- 토큰 -->
      <div class="asana-token-box">
        <div id="tokenInputArea">
          <div class="field" style="margin-bottom:10px;">
            <label>Asana Personal Access Token</label>
            <div class="token-row">
              <input type="password" id="asanaToken" placeholder="토큰을 입력하세요">
              <button class="btn primary token-btn" onclick="saveToken()">저장</button>
            </div>
          </div>
        </div>
        <div id="tokenSavedArea" style="display:none;display:flex;align-items:center;justify-content:space-between;">
          <span id="tokenStatus" class="token-status"></span>
          <button class="btn token-btn" onclick="clearToken()" style="font-size:12px;padding:6px 12px !important;">토큰 초기화</button>
        </div>
        <div id="tokenStatus2" class="token-status" style="display:none;"></div>
        <div class="token-guide" id="tokenGuide">
          <div class="token-guide-title">📌 토큰 발급 방법</div>
          <ol class="token-guide-steps">
            <li>PC에서 <a href="https://app.asana.com" target="_blank">app.asana.com</a> 접속</li>
            <li>우측 상단 프로필 사진 클릭 → <b>My Settings</b></li>
            <li><b>Apps</b> 탭 → <b>Developer apps</b> → <b>New access token</b></li>
            <li>이름 입력 후 생성 — 토큰은 최초 1회만 표시되니 바로 복사하세요</li>
          </ol>
          <div class="token-warning">
            ⚠️ <b>보안 주의사항</b><br>
            토큰은 내 Asana 계정 전체에 접근할 수 있는 비밀번호와 같습니다.<br>
            • 본인 컴퓨터에서만 사용하세요<br>
            • 타인에게 토큰을 공유하지 마세요<br>
            • 유출 시 즉시 Asana에서 해당 토큰을 삭제하세요
          </div>
        </div>
      </div>

      <!-- STEP 1: 위치 선택 -->
      <div class="asana-step" id="stepLocation">
        <div class="step-label">STEP 1 — 태스크 위치 선택</div>
        <div class="location-tabs">
          <button class="loc-tab" onclick="setLocMode('project')">저장된 프로젝트</button>
          <button class="loc-tab active" onclick="setLocMode('link')">링크 직접 입력</button>
        </div>

        <div id="locProject" style="display:none;">
          <div id="savedProjectList">
            <div style="font-size:12px;color:var(--text-sub);margin-bottom:10px;">링크로 추가한 프로젝트 목록이에요.</div>
            <div id="savedProjectItems"></div>
            <div style="font-size:12px;color:var(--text-sub);margin-top:8px;">링크 직접 입력 탭에서 프로젝트를 추가하면 여기에 저장됩니다.</div>
          </div>
          <div class="field" style="margin-top:12px;display:none;" id="savedSectionWrap">
            <label>섹션</label>
            <select id="asanaSection" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;outline:none;">
              <option value="">섹션 없음 (기본)</option>
            </select>
          </div>
        </div>

        <div id="locLink">
          <div class="field" style="margin-bottom:10px;">
            <label>Asana 프로젝트 또는 섹션 링크</label>
            <div style="display:flex;gap:8px;">
              <input type="text" id="asanaLink" placeholder="https://app.asana.com/..." oninput="onLinkInput()" style="flex:1;">
            </div>
          </div>
          <div id="linkProjectResult" style="display:none;">

// ===== 태그 선택 =====
function toggleLabel(el, val) {
  document.querySelectorAll('#labelGroup .tag').forEach(t => t.classList.remove('selected'));
  el.classList.add('selected');
  selectedLabels = [val];
  updatePreview();
}

function toggleWorkType(el, val) {
  if (el.classList.contains('selected')) {
    el.classList.remove('selected');
    selectedWorkTypes = selectedWorkTypes.filter(v => v !== val);
  } else {
    el.classList.add('selected');
    selectedWorkTypes.push(val);
  }
  updatePreview();
}

// ===== 미리보기 업데이트 =====
function getManager() {
  const radio = document.querySelector('input[name="mgr"]:checked');
  if (!radio || radio.value === 'none') return '';
  return document.getElementById('mgrName')?.value.trim() || '';
}

function formatDate(dateStr) {
  if (!dateStr) return '{일정}';
  const d = new Date(dateStr);
  return `${d.getMonth() + 1}월 ${d.getDate()}일`;
}

function joinWorkTypes(arr) {
  if (!arr.length) return '{작업종류}';
  if (arr.length === 1) return arr[0];
  return arr.slice(0, -1).join(', ') + ' 및 ' + arr[arr.length - 1];
}

function updatePreview() {
  const tpl = templates['교정고'];
  if (!tpl) return;

  const label = selectedLabels[0] || '';
  const workTitle = document.getElementById('workTitle')?.value.trim() || '';
  const workVolume = document.getElementById('workVolume')?.value.trim() || '';
  const dateVal = document.getElementById('schedDate')?.value || '';
  const manager = getManager();
  const workTypeStr = joinWorkTypes(selectedWorkTypes);

  // 제목
  const labelBracket = label ? `[${label}]` : '[레이블]';
  const titlePart = workTitle ? `<${workTitle}>` : '<작품명>';
  const volPart = workVolume || '{분량}';
  const subject = `${labelBracket} ${titlePart} ${volPart} 교정고 송부 일정 안내드립니다.`;

  // 본문 치환
  const managerLine = manager ? `${label || '{레이블}'} ${manager}입니다.` : `${label || '{레이블}'}입니다.`;
  const signLine = manager ? `- ${label || '{레이블}'} ${manager} 드림.` : `- ${label || '{레이블}'} 드림.`;

  let body = tpl.body
    .replace(/\{레이블\} \{담당자\}입니다\./g, managerLine)
    .replace(/\[\{레이블\}\] \{담당자\} 드림\./g, signLine)
    .replace(/\[\{레이블\}\]/g, label || '{레이블}')
    .replace(/\{레이블\}/g, label || '{레이블}')
    .replace(/\{작품명\}/g, workTitle || '{작품명}')
    .replace(/\{분량\}/g, workVolume || '{분량}')
    .replace(/\{일정\}/g, formatDate(dateVal))
    .replace(/\{작업종류\}/g, workTypeStr)
    .replace(/\{담당자\}/g, manager || '');

  const subjEl = document.getElementById('previewSubject');
  const bodyEl = document.getElementById('previewBody');
  if (!subjEl || !bodyEl) return;
  subjEl.textContent = subject;
  subjEl.className = 'preview-subject-text filled';
  bodyEl.textContent = body;
  bodyEl.className = 'preview-body filled';

  // Asana 필드 동기화
  const taskTitleEl = document.getElementById('asanaTaskTitle');
  const dueDateEl = document.getElementById('asanaDueDate');
  const titleParts = [workTitle, workVolume, workTypeStr].filter(v => v && !v.startsWith('{'));
  if (taskTitleEl) {
    if (titleParts.length >= 2) {
      taskTitleEl.value = titleParts[0] + ' | ' + titleParts.slice(1).join(' ');
    } else {
      taskTitleEl.value = titleParts.join(' ');
    }
  }
  if (dueDateEl && dateVal) dueDateEl.value = dateVal;
}

function showCopied(id) {

}

function copyAll() {

async function loadProjects(token) {
  const sel = document.getElementById('asanaProject');
  if (!sel) return;
  sel.innerHTML = '<option value="my_tasks">📋 내 작업 (기본)</option><option value="">불러오는 중...</option>';
  try {
    // workspace ID 먼저 조회
    const meRes = await fetch('https://app.asana.com/api/1.0/users/me?opt_fields=workspaces', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const meData = await meRes.json();
    if (meData.errors) throw new Error(meData.errors[0].message);
    const workspaceGid = meData.data.workspaces?.[0]?.gid;
    if (!workspaceGid) throw new Error('워크스페이스를 찾을 수 없습니다');

    // 내가 멤버인 프로젝트만 조회
    const res = await fetch(`https://app.asana.com/api/1.0/projects?workspace=${workspaceGid}&opt_fields=name,gid&limit=100&is_member=true`, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const data = await res.json();
    if (data.errors) throw new Error(data.errors[0].message);
    sel.innerHTML = '<option value="my_tasks">📋 내 작업 (기본)</option>' +
      data.data.map(p => `<option value="${p.gid}">${p.name}</option>`).join('');
  } catch(e) {
    sel.innerHTML = '<option value="my_tasks">📋 내 작업 (기본)</option>';
    setTokenStatus('⚠️ 프로젝트 로드 실패 — ' + e.message, '#b91c1c');
  }
}

async function onProjectChange() {
  const token = localStorage.getItem('asana_token');
  const projectId = document.getElementById('asanaProject')?.value;
  const secSel = document.getElementById('asanaSection');
  if (!secSel) return;
  if (!projectId || projectId === 'my_tasks' || !token) {
    secSel.innerHTML = '<option value="">섹션 없음 (기본)</option>';
    return;
  }
  secSel.innerHTML = '<option value="">불러오는 중...</option>';
  try {
    const res = await fetch(`https://app.asana.com/api/1.0/projects/${projectId}/sections?opt_fields=name,gid`, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const data = await res.json();
    secSel.innerHTML = '<option value="">섹션 없음 (기본)</option>' +
      data.data.map(s => `<option value="${s.gid}">${s.name}</option>`).join('');
  } catch(e) {
    secSel.innerHTML = '<option value="">섹션 로드 실패</option>';
  }
  unlockStepTask();
}

async function onLinkInput() {
  const val = document.getElementById('asanaLink')?.value.trim();
  const resultEl = document.getElementById('linkProjectResult');
  const errorEl = document.getElementById('linkProjectError');
  const nameEl = document.getElementById('linkProjectName');
  if (!val) {
    if (resultEl) resultEl.style.display = 'none';
    if (errorEl) errorEl.style.display = 'none';
    return;
  }
  const parsed = parseAsanaLink(val);
  if (!parsed?.projectId && !parsed?.taskId) {
    if (resultEl) resultEl.style.display = 'none';
    if (errorEl) errorEl.style.display = 'block';
    return;
  }
  const token = localStorage.getItem('asana_token');
  if (!token) { unlockStepTask(); return; }

  try {
    if (parsed.taskId) {
      // 태스크 링크 → 하위작업 추가 모드
      const res = await fetch(`https://app.asana.com/api/1.0/tasks/${parsed.taskId}?opt_fields=name,gid`, {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const data = await res.json();
      if (data.errors || !data.data) throw new Error();

      if (nameEl) nameEl.textContent = '📌 ' + data.data.name;
      if (resultEl) resultEl.style.display = 'block';
      if (errorEl) errorEl.style.display = 'none';

      // 섹션 숨기기 (태스크 모드에선 불필요)
      const secSel = document.getElementById('linkSection');
      if (secSel) secSel.parentElement.style.display = 'none';

      unlockStepTask();
    } else {
      // 프로젝트 링크 → 새 태스크 생성 모드
      const res = await fetch(`https://app.asana.com/api/1.0/projects/${parsed.projectId}?opt_fields=name,gid`, {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const data = await res.json();
      if (data.errors || !data.data) throw new Error();

      if (nameEl) nameEl.textContent = data.data.name;
      if (resultEl) resultEl.style.display = 'block';
      if (errorEl) errorEl.style.display = 'none';

      // 섹션 로드
      const secSel = document.getElementById('linkSection');
      if (secSel) {
        secSel.parentElement.style.display = 'block';
        secSel.innerHTML = '<option value="">불러오는 중...</option>';
        const secRes = await fetch(`https://app.asana.com/api/1.0/projects/${parsed.projectId}/sections?opt_fields=name,gid`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const secData = await secRes.json();
        secSel.innerHTML = '<option value="">섹션 없음 (기본)</option>' +
          (secData.data || []).map(s => `<option value="${s.gid}">${s.name}</option>`).join('');
      }
      unlockStepTask();
    }
  } catch(e) {
    if (resultEl) resultEl.style.display = 'none';
    if (errorEl) errorEl.style.display = 'block';
  }
}

// 링크에서 프로젝트/섹션 ID 추출
function parseAsanaLink(url) {
  // 태스크 링크: /task/{task_id}
  const taskMatch = url.match(/\/task\/(\d+)/);
  if (taskMatch) return { taskId: taskMatch[1], projectId: null, sectionId: null };

  // 형식1: https://app.asana.com/0/{project_id}/...
  const match0 = url.match(/asana\.com\/0\/(\d+)/);
  if (match0) return { projectId: match0[1], sectionId: null, taskId: null };

  // 형식2: https://app.asana.com/1/{workspace}/project/{project_id}/list/{section_id}
  const match1 = url.match(/\/project\/(\d+)(?:\/[^/]+\/(\d+))?/);
  if (match1) return { projectId: match1[1], sectionId: match1[2] || null, taskId: null };

  // 형식3: 숫자만 입력한 경우 (project ID 직접)
  const matchNum = url.match(/^\d+$/);
  if (matchNum) return { projectId: url.trim(), sectionId: null, taskId: null };

  return null;
}

async function createAsanaTask() {
  const token = localStorage.getItem('asana_token');
  if (!token) { showAsanaResult('❌ 토큰을 먼저 저장해 주세요.', '#b91c1c'); return; }

  const title = document.getElementById('asanaTaskTitle')?.value.trim();
  if (!title) { showAsanaResult('❌ 메일 입력값을 먼저 채워주세요.', '#b91c1c'); return; }

  const dueDate = document.getElementById('asanaDueDate')?.value || '';
  showAsanaResult('생성 중...', 'var(--primary)');

  try {
    // 내 정보 조회
    const meRes = await fetch('https://app.asana.com/api/1.0/users/me', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const meData = await meRes.json();
    const myGid = meData.data?.gid;
    const today = new Date().toISOString().split('T')[0];

    let taskBody = {
    name: title,
    due_on: dueDate || undefined,
    assignee: myGid
  };

    if (locMode === 'link') {
      const link = document.getElementById('asanaLink')?.value.trim();
      const parsed = parseAsanaLink(link);
      if (parsed?.taskId) {
        // 기존 태스크에 하위작업 추가
        taskBody.parent = parsed.taskId;
      } else if (parsed?.projectId) {
        taskBody.projects = [parsed.projectId];
        const linkSec = document.getElementById('linkSection')?.value;
        if (linkSec) taskBody.memberships = [{ project: parsed.projectId, section: linkSec }];
      } else {
        taskBody.assignee = myGid;
        taskBody.assignee_status = 'today';
      }
    } else {
      if (selectedSavedProject?.taskId) {
        taskBody.parent = selectedSavedProject.taskId;
      } else if (selectedSavedProject?.projectId) {
        taskBody.projects = [selectedSavedProject.projectId];
        const sectionId = document.getElementById('asanaSection')?.value;
        if (sectionId) taskBody.memberships = [{ project: selectedSavedProject.projectId, section: sectionId }];
      } else {
        taskBody.assignee = myGid;
        taskBody.assignee_status = 'today';
      }
    }

    // 태스크 생성
    const taskRes = await fetch('https://app.asana.com/api/1.0/tasks', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: taskBody })
    });
    const taskData = await taskRes.json();
    if (taskData.errors) throw new Error(taskData.errors[0].message);
    const taskGid = taskData.data.gid;

    // 하위 작업: 팀 내 공유
    if (document.getElementById('subShare')?.checked) {
      await fetch('https://app.asana.com/api/1.0/tasks', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: { name: '팀 내 공유', parent: taskGid, due_on: today, assignee: myGid } })
      });
    }

    // 하위 작업: 직접 입력
    const customTitle = document.getElementById('subCustomTitle')?.value.trim();
    const customDate = document.getElementById('subCustomDate')?.value;
    if (document.getElementById('subCustomCheck')?.checked && customTitle) {
      await fetch('https://app.asana.com/api/1.0/tasks', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: { name: customTitle, parent: taskGid, due_on: customDate || undefined, assignee: myGid } })
      });
    }

    showAsanaResult('✅ 태스크가 생성되었습니다!', '#1e7e34');
  } catch(e) {
    showAsanaResult('❌ 오류: ' + e.message, '#b91c1c');
  }
}

            <div class="field" id="linkSectionWrapP">

// ===== 표지제안서 상태 =====
let selectedLabelsP = [];
let locModeP = 'link';
let selectedSavedProjectP = null;

function toggleLabelP(el, val) {
  document.querySelectorAll('#labelGroupP .tag').forEach(t => t.classList.remove('selected'));
  el.classList.add('selected');
  selectedLabelsP = [val];
  updatePreviewP();
}

function getManagerP() {
  const radio = document.querySelector('input[name="mgrP"]:checked');
  if (!radio || radio.value === 'none') return '';
  return document.getElementById('mgrNameP')?.value.trim() || '';
}

function formatDateP(dateStr) {
  if (!dateStr) return '{회신 요청일}';
  const d = new Date(dateStr);
  return `${d.getMonth() + 1}월 ${d.getDate()}일`;
}

function addDays(dateStr, days) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  d.setDate(d.getDate() + days);
  return d.toISOString().split('T')[0];
}

function updatePreviewP() {
  const tpl = templates['표지제안서'];
  if (!tpl) return;

  const label = selectedLabelsP[0] || '';
  const workTitle = document.getElementById('workTitleP')?.value.trim() || '';
  const replyDate = document.getElementById('replyDateP')?.value || '';
  const manager = getManagerP();

  const labelBracket = label ? `[${label}]` : '[레이블]';
  const titlePart = workTitle ? `<${workTitle}>` : '<작품명>';
  const subject = `${labelBracket} ${titlePart} 표지제안서 전달드립니다.`;

  const managerLine = manager ? `${label || '{레이블}'} ${manager}입니다.` : `${label || '{레이블}'}입니다.`;
  const signLine = manager ? `- ${label || '{레이블}'} ${manager} 드림.` : `- ${label || '{레이블}'} 드림.`;

  let body = tpl.body
    .replace(/\{레이블\} \{담당자\}입니다\./g, managerLine)
    .replace(/- \{레이블\} \{담당자\} 드림\./g, signLine)
    .replace(/\{레이블\}/g, label || '{레이블}')
    .replace(/\{작품명\}/g, workTitle || '{작품명}')
    .replace(/\{회신요청일\}/g, formatDateP(replyDate))
    .replace(/\{담당자\}/g, manager || '');

  const subjEl = document.getElementById('previewSubjectP');
  const bodyEl = document.getElementById('previewBodyP');
  if (!subjEl || !bodyEl) return;
  subjEl.textContent = subject;
  subjEl.className = 'preview-subject-text filled';
  bodyEl.textContent = body;
  bodyEl.className = 'preview-body filled';

  // Asana 필드 동기화
  const taskTitleEl = document.getElementById('asanaTaskTitleP');
  const dueDateEl = document.getElementById('asanaDueDateP');
  if (taskTitleEl && workTitle) taskTitleEl.value = `${workTitle} | 표지제안서 입고`;
  if (dueDateEl && replyDate) dueDateEl.value = replyDate;
}

function copyBodyP() {
  const body = document.getElementById('previewBodyP')?.textContent;
  if (body) navigator.clipboard.writeText(body).then(() => {
    const el = document.getElementById('copiedMsgP');
    if (el) { el.style.display = 'inline'; setTimeout(() => { el.style.display = 'none'; }, 2000); }
  });
}

function copyAllP() {
  const subj = document.getElementById('previewSubjectP')?.textContent;
  const body = document.getElementById('previewBodyP')?.textContent;
  if (subj && body) navigator.clipboard.writeText(`제목: ${subj}\n\n${body}`).then(() => {
    const el = document.getElementById('copiedMsgP');
    if (el) { el.style.display = 'inline'; setTimeout(() => { el.style.display = 'none'; }, 2000); }
  });
}

function autoCheckCustomP() {
  const title = document.getElementById('subCustomTitleP')?.value.trim();
  const cb = document.getElementById('subCustomCheckP');
  if (cb) cb.checked = !!title;
}

// ===== Asana 표지제안서 =====
function initAsanaP() {
  const token = localStorage.getItem('asana_token');
  if (token) {
    document.getElementById('asanaTokenP').value = token;
    showTokenSavedP();
  }
  renderSavedProjectsP();
}

function saveTokenP() {
  const token = document.getElementById('asanaTokenP').value.trim();
  if (!token) return;
  localStorage.setItem('asana_token', token);
  showTokenSavedP();
}

function clearTokenP() {
  localStorage.removeItem('asana_token');
  document.getElementById('asanaTokenP').value = '';
  showTokenInputP();
}

function showTokenSavedP() {
  document.getElementById('tokenInputAreaP').style.display = 'none';
  document.getElementById('tokenSavedAreaP').style.display = 'flex';
  const el = document.getElementById('tokenStatusP');
  if (el) { el.textContent = '✅ 토큰이 연결되었습니다.'; el.style.color = '#1e7e34'; }
}

function showTokenInputP() {
  document.getElementById('tokenInputAreaP').style.display = 'block';
  document.getElementById('tokenSavedAreaP').style.display = 'none';
}

function setLocModeP(mode, e) {
  locModeP = mode;
  document.querySelectorAll('#stepLocationP .loc-tab').forEach(t => t.classList.remove('active'));
  e.target.classList.add('active');
  document.getElementById('locProjectP').style.display = mode === 'project' ? 'block' : 'none';
  document.getElementById('locLinkP').style.display = mode === 'link' ? 'block' : 'none';
  if (mode === 'project') renderSavedProjectsP();
}

async function onLinkInputP() {
  const val = document.getElementById('asanaLinkP')?.value.trim();
  const resultEl = document.getElementById('linkProjectResultP');
  const errorEl = document.getElementById('linkProjectErrorP');
  const nameEl = document.getElementById('linkProjectNameP');
  if (!val) { if (resultEl) resultEl.style.display = 'none'; if (errorEl) errorEl.style.display = 'none'; return; }
  const parsed = parseAsanaLink(val);
  if (!parsed?.projectId && !parsed?.taskId) { if (resultEl) resultEl.style.display = 'none'; if (errorEl) errorEl.style.display = 'block'; return; }
  const token = localStorage.getItem('asana_token');
  if (!token) { unlockStepTaskP(); return; }
  try {
    if (parsed.taskId) {
      const res = await fetch(`https://app.asana.com/api/1.0/tasks/${parsed.taskId}?opt_fields=name,gid`, { headers: { 'Authorization': 'Bearer ' + token } });
      const data = await res.json();
      if (data.errors || !data.data) throw new Error();
      if (nameEl) nameEl.textContent = '📌 ' + data.data.name;
      if (resultEl) resultEl.style.display = 'block';
      if (errorEl) errorEl.style.display = 'none';
      const sw = document.getElementById('linkSectionWrapP');
      if (sw) sw.style.display = 'none';
    } else {
      const res = await fetch(`https://app.asana.com/api/1.0/projects/${parsed.projectId}?opt_fields=name,gid`, { headers: { 'Authorization': 'Bearer ' + token } });
      const data = await res.json();
      if (data.errors || !data.data) throw new Error();
      if (nameEl) nameEl.textContent = data.data.name;
      if (resultEl) resultEl.style.display = 'block';
      if (errorEl) errorEl.style.display = 'none';
      const sw = document.getElementById('linkSectionWrapP');
      if (sw) sw.style.display = 'block';
      const secSel = document.getElementById('linkSectionP');
      if (secSel) {
        secSel.innerHTML = '<option value="">불러오는 중...</option>';
        const secRes = await fetch(`https://app.asana.com/api/1.0/projects/${parsed.projectId}/sections?opt_fields=name,gid`, { headers: { 'Authorization': 'Bearer ' + token } });
        const secData = await secRes.json();
        secSel.innerHTML = '<option value="">섹션 없음 (기본)</option>' + (secData.data || []).map(s => `<option value="${s.gid}">${s.name}</option>`).join('');
      }
    }
    unlockStepTaskP();
  } catch(e) { if (resultEl) resultEl.style.display = 'none'; if (errorEl) errorEl.style.display = 'block'; }
}

function unlockStepTaskP() {
  const step = document.getElementById('stepTaskP');
  if (step) step.classList.remove('locked');
}

function saveCurrentProjectP() {
  const name = document.getElementById('linkProjectNameP')?.textContent;
  const url = document.getElementById('asanaLinkP')?.value.trim();
  const parsed = parseAsanaLink(url);
  if (!name || (!parsed?.projectId && !parsed?.taskId)) return;
  let saved = JSON.parse(localStorage.getItem('saved_projects') || '[]');
  const id = parsed.taskId || parsed.projectId;
  const type = parsed.taskId ? 'task' : 'project';
  if (saved.find(p => (p.taskId || p.projectId) === id)) { alert('이미 저장된 항목입니다!'); return; }
  saved.push(type === 'task' ? { name: name.replace('📌 ', ''), taskId: parsed.taskId, type } : { name, projectId: parsed.projectId, type });
  localStorage.setItem('saved_projects', JSON.stringify(saved));
  alert(`저장되었습니다!`);
  renderSavedProjectsP();
}

function renderSavedProjectsP() {
  const container = document.getElementById('savedProjectItemsP');
  if (!container) return;
  const saved = JSON.parse(localStorage.getItem('saved_projects') || '[]');
  if (!saved.length) { container.innerHTML = ''; return; }
  container.innerHTML = saved.map((p, i) => {
    const icon = p.type === 'task' ? '📌' : '📁';
    const id = p.taskId || p.projectId;
    const displayName = p.name.replace('📌 ', '');
    return `<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:all 0.15s;" id="savedProjP_${i}" onclick="selectSavedProjectP(${i},'${id}','${displayName.replace(/'/g,"\'")}','${p.type || 'project'}')">
      <span style="font-size:14px;">${icon}</span>
      <span style="font-size:13px;flex:1;">${displayName}</span>
      <span style="font-size:11px;background:var(--primary-light);color:var(--primary);padding:2px 8px;border-radius:4px;">${p.type === 'task' ? '태스크' : '프로젝트'}</span>
      <span style="font-size:11px;color:#b91c1c;cursor:pointer;padding:2px 6px;" onclick="event.stopPropagation();deleteSavedProjectP(${i})">삭제</span>
    </div>`;
  }).join('');
}

function selectSavedProjectP(idx, id, name, type) {
  selectedSavedProjectP = type === 'task' ? { taskId: id, name, type } : { projectId: id, name, type };
  document.querySelectorAll('[id^="savedProjP_"]').forEach(el => { el.style.borderColor = 'var(--border)'; el.style.background = 'var(--white)'; });
  const el = document.getElementById('savedProjP_' + idx);
  if (el) { el.style.borderColor = 'var(--primary)'; el.style.background = 'var(--primary-light)'; }
  const token = localStorage.getItem('asana_token');
  const secWrap = document.getElementById('savedSectionWrapP');
  const secSel = document.getElementById('asanaSectionP');
  if (type === 'task') { if (secWrap) secWrap.style.display = 'none'; }
  else {
    if (secWrap) secWrap.style.display = 'block';
    if (secSel && token) {
      secSel.innerHTML = '<option value="">불러오는 중...</option>';
      fetch(`https://app.asana.com/api/1.0/projects/${id}/sections?opt_fields=name,gid`, { headers: { 'Authorization': 'Bearer ' + token } })
        .then(r => r.json()).then(data => { secSel.innerHTML = '<option value="">섹션 없음 (기본)</option>' + (data.data || []).map(s => `<option value="${s.gid}">${s.name}</option>`).join(''); });
    }
  }
  unlockStepTaskP();
}

function deleteSavedProjectP(idx) {
  let saved = JSON.parse(localStorage.getItem('saved_projects') || '[]');
  saved.splice(idx, 1);
  localStorage.setItem('saved_projects', JSON.stringify(saved));
  selectedSavedProjectP = null;
  renderSavedProjectsP();
}

async function createAsanaTaskP() {
  const token = localStorage.getItem('asana_token');
  if (!token) { showAsanaResultP('❌ 토큰을 먼저 저장해 주세요.', '#b91c1c'); return; }
  const title = document.getElementById('asanaTaskTitleP')?.value.trim();
  if (!title) { showAsanaResultP('❌ 메일 입력값을 먼저 채워주세요.', '#b91c1c'); return; }
  const dueDate = document.getElementById('asanaDueDateP')?.value || '';
  const dueDatePlus1 = addDays(dueDate, 1);
  showAsanaResultP('생성 중...', 'var(--primary)');
  try {
    const meRes = await fetch('https://app.asana.com/api/1.0/users/me', { headers: { 'Authorization': 'Bearer ' + token } });
    const meData = await meRes.json();
    const myGid = meData.data?.gid;
    const today = new Date().toISOString().split('T')[0];

    let taskBody = { name: title, due_on: dueDate || undefined, assignee: myGid };

    if (locModeP === 'link') {
      const parsed = parseAsanaLink(document.getElementById('asanaLinkP')?.value.trim());
      if (parsed?.taskId) { taskBody.parent = parsed.taskId; }
      else if (parsed?.projectId) {
        taskBody.projects = [parsed.projectId];
        const linkSec = document.getElementById('linkSectionP')?.value;
        if (linkSec) taskBody.memberships = [{ project: parsed.projectId, section: linkSec }];
      } else { taskBody.assignee_status = 'today'; }
    } else {
      if (selectedSavedProjectP?.taskId) { taskBody.parent = selectedSavedProjectP.taskId; }
      else if (selectedSavedProjectP?.projectId) {
        taskBody.projects = [selectedSavedProjectP.projectId];
        const sectionId = document.getElementById('asanaSectionP')?.value;
        if (sectionId) taskBody.memberships = [{ project: selectedSavedProjectP.projectId, section: sectionId }];
      } else { taskBody.assignee_status = 'today'; }
    }

    const taskRes = await fetch('https://app.asana.com/api/1.0/tasks', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify({ data: taskBody }) });
    const taskData = await taskRes.json();
    if (taskData.errors) throw new Error(taskData.errors[0].message);
    const taskGid = taskData.data.gid;

    // 고정 하위작업: 표지 일러레/디자이너에게 표지제안서 전달
    if (document.getElementById('subShareP')?.checked) {
      await fetch('https://app.asana.com/api/1.0/tasks', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: { name: '표지 일러레/디자이너 에게 표지제안서 전달', parent: taskGid, due_on: dueDatePlus1 || today, assignee: myGid } }) });
    }

    // 직접 입력 하위작업
    const customTitle = document.getElementById('subCustomTitleP')?.value.trim();
    const customDate = document.getElementById('subCustomDateP')?.value;
    if (document.getElementById('subCustomCheckP')?.checked && customTitle) {
      await fetch('https://app.asana.com/api/1.0/tasks', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: { name: customTitle, parent: taskGid, due_on: customDate || undefined, assignee: myGid } }) });
    }

    showAsanaResultP('✅ 태스크가 생성되었습니다!', '#1e7e34');
  } catch(e) { showAsanaResultP('❌ 오류: ' + e.message, '#b91c1c'); }
}

function showAsanaResultP(msg, color) {
  const el = document.getElementById('asanaResultP');
  if (el) { el.textContent = msg; el.style.color = color; }
}

// ===== 저장된 프로젝트 관리 =====
let selectedSavedProject = null;

function saveCurrentProject() {
  const name = document.getElementById('linkProjectName')?.textContent;
  const url = document.getElementById('asanaLink')?.value.trim();
  const parsed = parseAsanaLink(url);
  if (!name || (!parsed?.projectId && !parsed?.taskId)) return;

  let saved = JSON.parse(localStorage.getItem('saved_projects') || '[]');
  const id = parsed.taskId || parsed.projectId;
  const type = parsed.taskId ? 'task' : 'project';

  if (saved.find(p => (p.taskId || p.projectId) === id)) {
    alert('이미 저장된 항목입니다!');
    return;
  }
  if (type === 'task') {
    saved.push({ name, taskId: parsed.taskId, type: 'task' });
  } else {
    saved.push({ name, projectId: parsed.projectId, type: 'project' });
  }
  localStorage.setItem('saved_projects', JSON.stringify(saved));
  alert(`"${name.replace('📌 ', '')}" 저장되었습니다!`);
}

function renderSavedProjects() {
  const container = document.getElementById('savedProjectItems');
  if (!container) return;
  const saved = JSON.parse(localStorage.getItem('saved_projects') || '[]');
  if (!saved.length) {
    container.innerHTML = '';
    return;
  }
  container.innerHTML = saved.map((p, i) => {
    const icon = p.type === 'task' ? '📌' : '📁';
    const id = p.taskId || p.projectId;
    const displayName = p.name.replace('📌 ', '');
    return `
    <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:all 0.15s;"
      id="savedProj_${i}"
      onclick="selectSavedProject(${i},'${id}','${displayName.replace(/'/g,"\'")}','${p.type || 'project'}')">
      <span style="font-size:14px;">${icon}</span>
      <span style="font-size:13px;flex:1;">${displayName}</span>
      <span style="font-size:11px;color:var(--text-sub);background:var(--primary-light);color:var(--primary);padding:2px 8px;border-radius:4px;">${p.type === 'task' ? '태스크' : '프로젝트'}</span>
      <span style="font-size:11px;color:#b91c1c;cursor:pointer;padding:2px 6px;" onclick="event.stopPropagation();deleteSavedProject(${i})">삭제</span>
    </div>
  `}).join('');
}

function selectSavedProject(idx, id, name, type) {
  selectedSavedProject = type === 'task' ? { taskId: id, name, type } : { projectId: id, name, type };
  document.querySelectorAll('[id^="savedProj_"]').forEach(el => {
    el.style.borderColor = 'var(--border)';
    el.style.background = 'var(--white)';
  });
  const el = document.getElementById('savedProj_' + idx);
  if (el) { el.style.borderColor = 'var(--primary)'; el.style.background = 'var(--primary-light)'; }

  const token = localStorage.getItem('asana_token');
  const secWrap = document.getElementById('savedSectionWrap');
  const secSel = document.getElementById('asanaSection');

  if (type === 'task') {
    // 태스크 모드 - 섹션 불필요
    if (secWrap) secWrap.style.display = 'none';
  } else {
    // 프로젝트 모드 - 섹션 로드
    if (secWrap) secWrap.style.display = 'block';
    if (secSel && token) {
      secSel.innerHTML = '<option value="">불러오는 중...</option>';
      fetch(`https://app.asana.com/api/1.0/projects/${id}/sections?opt_fields=name,gid`, {
        headers: { 'Authorization': 'Bearer ' + token }
      }).then(r => r.json()).then(data => {
        secSel.innerHTML = '<option value="">섹션 없음 (기본)</option>' +
          (data.data || []).map(s => `<option value="${s.gid}">${s.name}</option>`).join('');
      });
    }
  }
  unlockStepTask();
}

function deleteSavedProject(idx) {
  let saved = JSON.parse(localStorage.getItem('saved_projects') || '[]');
  saved.splice(idx, 1);
  localStorage.setItem('saved_projects', JSON.stringify(saved));
  selectedSavedProject = null;
  renderSavedProjects();
}

// ===== 초기화 =====
document.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
